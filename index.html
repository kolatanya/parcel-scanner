<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EEE2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ecomflex">
<title>Ecomflex</title>
<style>
:root{
  /* ecomFLEX brand */
  --cream:#F4EEE2; --panel:#FFFCF6; --edge:#E1D8C6; --edge2:#D3C7AF;
  --ink:#33334E; --navy:#48486C; --muted:#7C7C93;
  --red:#EA3D49; --blue:#45B0C8; --deep:#2E8FA8;
  --ok:#2E8FA8; --warn:#B0761A; --bad:#D62F3C;
  --stock:#FFFFFF; --stock-ink:#33334E;
  /* the viewfinder stays dark, it is live video */
  --lens:#0B0E12;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans)}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:26px 16px 40px}

header{margin-bottom:26px;padding-bottom:18px;border-bottom:2px solid var(--edge2)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:38px;width:auto;display:block}
.brand .bars{display:flex;gap:2px;height:30px;align-items:stretch}
.brand .bars i{display:block;background:var(--ink);border-radius:1px}
.brand .bars i.a{background:var(--red)}
h1{margin:0;font-size:1.6rem;font-weight:650;letter-spacing:-.02em;color:var(--navy)}
.sub{margin:7px 0 0;color:var(--muted);font-size:.87rem}

.tools{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tools a{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
  background:var(--panel);border:1px solid var(--edge);border-radius:11px;padding:16px;
  box-shadow:0 1px 0 rgba(72,72,108,.05)}
.tools a:active{border-color:var(--red);background:#FFF7F1}
.glyph{flex:none;width:46px;height:46px;border-radius:9px;background:#EFF7F9;border:1px solid #CDE4EA;color:var(--deep);
  display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.tools .name{font-weight:600;font-size:1.02rem}
.tools .desc{color:var(--muted);font-size:.82rem;margin-top:2px;line-height:1.35}
.tools .go{flex:none;color:var(--muted);font-size:1.3rem;padding-left:4px}

.install{margin-top:20px;background:var(--panel);border:1px solid var(--edge);border-radius:11px;padding:15px}
.install h2{margin:0 0 5px;font-size:.95rem;font-weight:600}
.install p{margin:0;font-size:.83rem;color:var(--muted);line-height:1.5}
.install button{margin-top:11px;width:100%;padding:14px;border:0;border-radius:9px;
  background:var(--red);color:#fff;font-weight:600;font-size:.95rem;cursor:pointer;font-family:inherit}

.foot{margin-top:26px;font-size:.74rem;color:#8E8EA3;line-height:1.6}
.foot code{font-family:var(--mono)}
a:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <img src="logo.png" alt="ecomFLEX">
    </div>
    <p class="sub">Warehouse tools</p>
  </header>

  <ul class="tools" id="tools"></ul>

  <div class="install" id="install" hidden>
    <h2>Put this on the home screen</h2>
    <p>Installs as an app with its own icon, and keeps working when the wifi drops out.</p>
    <button id="installbtn">Install Ecomflex</button>
  </div>

  <p class="foot">Everything runs on the phone. Nothing is sent anywhere.<br>
  To add a tool: upload its <code>.html</code> file, then add one line to the <code>TOOLS</code> list at the top of <code>index.html</code>.</p>
</div>

<script>
/* ===========================================================
   ADD A NEW TOOL HERE
   Upload the tool's .html file to the repository, then copy one
   of these lines and change the four values. That is the whole job.
   =========================================================== */
var TOOLS = [
  {
    name:  'Panel requests',
    desc:  'Approve or reject customers asking for access to the panel',
    url:   'admin.html',
    glyph: '\u2713'
  },
  {
    name:  'Label reader',
    desc:  'Drop in label PDFs and get one ready-to-paste line per parcel',
    url:   'labels.html',
    glyph: '\u2338'
  },
  {
    name:  'Parcel scanner',
    desc:  'Scan Royal Mail and DPD barcodes into a list you can copy in one go',
    url:   'scanner.html',
    glyph: '\u2016'
  }
];
/* =========================================================== */

(function(){
"use strict";
var ul=document.getElementById('tools');
TOOLS.forEach(function(t){
  var li=document.createElement('li');
  var a=document.createElement('a');
  a.href=t.url;
  var g=document.createElement('div'); g.className='glyph'; g.textContent=t.glyph||'\u25A6';
  var body=document.createElement('div'); body.style.flex='1'; body.style.minWidth='0';
  var n=document.createElement('div'); n.className='name'; n.textContent=t.name;
  var d=document.createElement('div'); d.className='desc'; d.textContent=t.desc;
  body.appendChild(n); body.appendChild(d);
  var go=document.createElement('div'); go.className='go'; go.textContent='\u203A';
  a.appendChild(g); a.appendChild(body); a.appendChild(go);
  li.appendChild(a); ul.appendChild(li);
});

/* offline support */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

/* install prompt (Android/Chrome; iOS uses Share > Add to Home Screen) */
var deferred=null, box=document.getElementById('install');
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault(); deferred=e; box.hidden=false;
});
document.getElementById('installbtn').onclick=function(){
  if(!deferred) return;
  deferred.prompt();
  deferred.userChoice.then(function(){ deferred=null; box.hidden=true; });
};
var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone;
if(!standalone && !deferred && /iPhone|iPad|iPod/.test(navigator.userAgent)){
  box.hidden=false;
  box.querySelector('p').textContent='In Safari, tap the Share button, then “Add to Home Screen”.';
  document.getElementById('installbtn').hidden=true;
}
})();
</script>
</body>
</html>
